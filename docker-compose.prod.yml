services:
  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      martin:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  postgis:
    image: postgis/postgis:latest
    env_file:
      - .env
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  web:
    image: vmemb/bachelorproject:latest
    env_file:
        - .env
    restart: unless-stopped
    depends_on:
      martin:
        condition: service_started
    expose:
      - "3000"

  martin:
    image: ghcr.io/maplibre/martin:latest
    restart: unless-stopped
    command: ["/pmtiles"]
    volumes:
      - ./tiles:/tiles:ro
    expose:
      - "3001"

volumes:
  postgis_data:
    external: true # since the volume was initially created outside of this compose file
    name: bachelor_postgis_data

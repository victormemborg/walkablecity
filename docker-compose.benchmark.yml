services:
  nginx:
    image: nginx:latest
    depends_on:
      - web
      - martin
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    build:
      dockerfile: ./15-minute-cities/Dockerfile
    expose:
      - "3000"

  martin:
    image: ghcr.io/maplibre/martin:latest
    command: ["/tiles", "-l", "0.0.0.0:3001"]
    volumes:
      - ./tiles:/tiles:ro
    expose:
      - "3001"

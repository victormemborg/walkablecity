name: Deployment of frontend

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        run: |
          docker build --build-arg TILESERV_INTERNAL_URL=http://tileserv:7800 -t vmemb/bachelorproject:latest -f 15-minute-cities/Dockerfile .
          docker push vmemb/bachelorproject:latest

  deploy:
    name: Deploy to server
    needs: build
    environment:
      name: production
      url: http://144.91.92.236:3000
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /home/${{ secrets.SERVER_USER }}/bachelor-thesis
          overwrite: true

      - name: Sync nginx config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: nginx/default.conf
          target: /home/${{ secrets.SERVER_USER }}/bachelor-thesis/nginx
          overwrite: true

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/bachelor-thesis
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

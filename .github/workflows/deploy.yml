name: Deployment of frontend

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        run: |
          docker build -t vmemb/bachelorproject:latest -f 15-minute-cities/Dockerfile .
          docker push vmemb/bachelorproject:latest

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/bachelor-thesis
            ls -la
            docker compose pull
            docker compose up -d
    


name: Release and benchmark walkablecity.app

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 15-minute-cities
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        working-directory: .
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy tiles from server
        shell: bash
        working-directory: .
        run: |
          mkdir -p tiles
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -r \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/bachelor-thesis/tiles/." \
            ./tiles/

      - name: Start benchmark stack
        shell: bash
        working-directory: .
        run: |
          docker compose -f docker-compose.benchmark.yml pull
          docker compose -f docker-compose.benchmark.yml up -d

      - name: Wait for benchmark app
        shell: bash
        working-directory: .
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.benchmark.yml ps
          docker compose -f docker-compose.benchmark.yml logs --tail=100
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: 15-minute-cities/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create benchmark output directory
        run: mkdir -p benchmark-results

      - name: Run benchmark
        env:
          BASE_URL: http://127.0.0.1:8080
          PLAYWRIGHT_SUMMARY_MD_PATH: benchmark-results/summary.md
        run: pnpm perf:playwright

      - name: Stop benchmark stack
        if: always()
        shell: bash
        working-directory: .
        run: docker compose -f docker-compose.benchmark.yml down --remove-orphans

      - name: Export benchmark summary for release notes
        id: export-summary
        shell: bash
        run: |
          {
            echo 'release_benchmark_summary<<EOF'
            cat benchmark-results/summary.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: 15-minute-cities/benchmark-results
          if-no-files-found: warn

  calculate-version:
    needs: benchmark
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          git fetch --tags

          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          latest_tag=${latest_tag:-v0.0.0}

          version=${latest_tag#v}

          IFS='.' read -r major minor patch <<< "$version"

          case "${{ inputs.release_type }}" in
            major)
              major=$((major+1)); minor=0; patch=0;;
            minor)
              minor=$((minor+1)); patch=0;;
            patch)
              patch=$((patch+1));;
          esac

          tag="v$major.$minor.$patch"

          echo "tag=$tag" >> $GITHUB_OUTPUT

  create-release:
    needs: [benchmark, calculate-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.calculate-version.outputs.tag }}
          name: Release ${{ needs.calculate-version.outputs.tag }}
          body: |
            Release ${{ needs.calculate-version.outputs.tag }}

            ${{ needs.benchmark.outputs.release_benchmark_summary }}
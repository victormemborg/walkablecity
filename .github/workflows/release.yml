name: Release and benchmark walkablecity.app

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 15-minute-cities
    outputs:
      release_benchmark_summary: ${{ steps.export-summary.outputs.release_benchmark_summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: 15-minute-cities/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Create benchmark output directory
        run: mkdir -p benchmark-results

      - name: Run production benchmark
        env:
          BASE_URL: https://walkablecity.app
          PLAYWRIGHT_SUMMARY_MD_PATH: benchmark-results/summary.md
        run: pnpm perf:playwright

      - name: Export benchmark summary for release notes
        id: export-summary
        shell: bash
        run: |
          {
            echo 'release_benchmark_summary<<EOF'
            cat benchmark-results/summary.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: 15-minute-cities/benchmark-results
          if-no-files-found: warn

  release:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          git fetch --tags

          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          latest_tag=${latest_tag:-v0.0.0}

          version=${latest_tag#v}

          IFS='.' read -r major minor patch <<< "$version"

          case "${{ inputs.release_type }}" in
            major)
              major=$((major+1)); minor=0; patch=0;;
            minor)
              minor=$((minor+1)); patch=0;;
            patch)
              patch=$((patch+1));;
          esac

          tag="v$major.$minor.$patch"

          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Release ${{ steps.version.outputs.tag }}

            ${{ needs.benchmark.outputs.release_benchmark_summary }}

name: Release and benchmark walkablecity.app

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semantic version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      benchmark_iterations:
        description: iterations for each user in the k6 benchmark
        required: true
        default: "5"
        type: string

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    outputs:
      release_benchmark_summary: ${{ steps.export-summary.outputs.release_benchmark_summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Create benchmark output directory
        run: mkdir -p 15-minute-cities/benchmark-results

      - name: Run production benchmark
        env:
          BASE_URL: https://walkablecity.app
          K6_ITERATIONS: ${{ inputs.benchmark_iterations }}
          K6_SUMMARY_MD_PATH: 15-minute-cities/benchmark-results/summary.md
        run: k6 run 15-minute-cities/perf/walkablecity.k6.js

      - name: Export benchmark summary for release notes
        id: export-summary
        shell: bash
        run: |
          {
            echo 'release_benchmark_summary<<EOF'
            cat 15-minute-cities/benchmark-results/summary.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: 15-minute-cities/benchmark-results
          if-no-files-found: warn

  release:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate next version
        id: version
        run: |
          git fetch --tags

          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          latest_tag=${latest_tag:-v0.0.0}

          version=${latest_tag#v}

          IFS='.' read -r major minor patch <<< "$version"

          case "${{ inputs.release_type }}" in
            major)
              major=$((major+1)); minor=0; patch=0;;
            minor)
              minor=$((minor+1)); patch=0;;
            patch)
              patch=$((patch+1));;
          esac

          tag="v$major.$minor.$patch"

          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Release ${{ steps.version.outputs.tag }}

            ${{ needs.benchmark.outputs.release_benchmark_summary }}

name: CI/CD pipeline

on:
  push:
    branches:
      - main
    paths:
      - '15-minute-cities/**'
      - 'preprocessing/**'
      - 'docker-compose.prod.yml'
      - 'nginx/**'
  workflow_dispatch:

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml
  deploy:
    needs: lint-and-test
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
